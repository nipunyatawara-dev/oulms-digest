name: Auto Retry LMS Check on Failure

on:
  workflow_run:
    workflows: ["OUSL LMS Daily Watcher"]
    types:
      - completed

permissions:
  actions: write

jobs:
  auto-retry:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 }}
    steps:
      - name: Re-run failed workflow on a fresh runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Run #${{ github.event.workflow_run.id }} attempt #${{ github.event.workflow_run.run_attempt }} ended with failure."
          echo "Automatically triggering re-run on a fresh runner VM..."
          gh run rerun ${{ github.event.workflow_run.id }} --failed
