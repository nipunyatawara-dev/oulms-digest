name: Auto Retry LMS Check on Failure

on:
  workflow_run:
    workflows: ["OUSL LMS Daily Watcher"]
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  auto-retry:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 }}
    steps:
      - name: Re-run failed workflow on a fresh runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Run #${{ github.event.workflow_run.id }} attempt #${{ github.event.workflow_run.run_attempt }} ended with failure."
          echo "Waiting 30 seconds before re-running on a fresh runner VM..."
          sleep 30
          gh run rerun ${{ github.event.workflow_run.id }} --failed --repo ${{ github.repository }}
