name: OUSL LMS Daily Watcher

on:
  schedule:
    # 01:30 UTC = 07:00 AM Sri Lanka Time (UTC+5:30)
    # 10:30 UTC = 04:00 PM Sri Lanka Time (UTC+5:30)
    # 16:30 UTC = 10:00 PM Sri Lanka Time (UTC+5:30)
    - cron: '30 1,10,16 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI or API
    inputs:
      ousl_username:
        description: 'OUSL Student Username / ID (optional override)'
        required: false
        type: string
      ousl_password:
        description: 'OUSL Student Password (optional override)'
        required: false
        type: string
      selected_courses:
        description: 'Comma-separated course codes to crawl (e.g. EEI4360,EEI4267)'
        required: false
        type: string

permissions:
  contents: write

# Keep the digest and its seen-item history in order across manual/scheduled runs.
concurrency:
  group: lms-digest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-lms:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Network Pre-check & Connectivity Fallback
        run: |
          echo "=== Runner Public IP ==="
          curl -s --connect-timeout 5 -m 8 https://api.ipify.org || echo "Could not determine public IP"
          echo ""
          echo "=== Testing direct connectivity to OUSL LMS (https://oulms.ou.ac.lk) ==="
          if curl -I -s --connect-timeout 8 -m 12 https://oulms.ou.ac.lk/login/index.php >/dev/null 2>&1; then
            echo "Direct connection to OUSL LMS succeeded."
          else
            echo "::warning:: Direct connection to OUSL LMS timed out or was dropped (Azure IP range blocked by LEARN)."
            echo "Activating Cloudflare WARP egress fallback..."
            
            # Setup Cloudflare package repository
            curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
            
            sudo apt-get update -qq
            sudo apt-get install -y -qq cloudflare-warp
            
            # Start WARP service and connect
            sudo systemctl start warp-svc
            sleep 2
            sudo warp-cli --accept-tos registration new || true
            sudo warp-cli --accept-tos mode warp || true
            sudo warp-cli --accept-tos connect || true
            sleep 3
            
            echo "=== Egress IP via Cloudflare WARP ==="
            curl -s --connect-timeout 5 -m 8 https://api.ipify.org || echo "Could not determine WARP IP"
            echo ""
            echo "=== Retesting connectivity to OUSL LMS via WARP ==="
            if curl -I -s --connect-timeout 10 -m 15 https://oulms.ou.ac.lk/login/index.php >/dev/null 2>&1; then
              echo "Successfully connected to OUSL LMS via Cloudflare WARP!"
            else
              echo "::warning:: WARP probe also timed out. Crawler will attempt browser connection with internal retries."
            fi
          fi

      - name: Run Crawler
        env:
          OUSL_USERNAME: ${{ inputs.ousl_username || secrets.OUSL_USERNAME }}
          OUSL_PASSWORD: ${{ inputs.ousl_password || secrets.OUSL_PASSWORD }}
          SELECTED_COURSES: ${{ inputs.selected_courses || secrets.SELECTED_COURSES }}
        run: |
          python crawler.py

      - name: Commit and push updated digest data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          python -c '
          import os, sys
          for root, _, files in os.walk("data"):
              for f in files:
                  fp = os.path.join(root, f)
                  size_mb = os.path.getsize(fp) / (1024 * 1024)
                  if size_mb > 50:
                      print(f"Error: {fp} is {size_mb:.2f} MB, exceeding 50 MB limit", file=sys.stderr)
                      sys.exit(1)
          '
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Update LMS academic digest data"
            git pull --rebase origin main
            git push origin main
          fi
