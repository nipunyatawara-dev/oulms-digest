name: OUSL LMS Daily Watcher

on:
  schedule:
    # 01:30 UTC = 07:00 AM Sri Lanka Time (UTC+5:30)
    # 10:30 UTC = 04:00 PM Sri Lanka Time (UTC+5:30)
    # 16:30 UTC = 10:00 PM Sri Lanka Time (UTC+5:30)
    - cron: '30 1,10,16 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI or API
    inputs:
      ousl_username:
        description: 'OUSL Student Username / ID (optional override)'
        required: false
        type: string
      ousl_password:
        description: 'OUSL Student Password (optional override)'
        required: false
        type: string
      selected_courses:
        description: 'Comma-separated course codes to crawl (e.g. EEI4360,EEI4267)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  check-lms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run Crawler
        env:
          OUSL_USERNAME: ${{ inputs.ousl_username || secrets.OUSL_USERNAME }}
          OUSL_PASSWORD: ${{ inputs.ousl_password || secrets.OUSL_PASSWORD }}
          SELECTED_COURSES: ${{ inputs.selected_courses || secrets.SELECTED_COURSES }}
        run: |
          python crawler.py

      - name: Commit and push updated digest data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update LMS academic digest data [skip ci]" && git push)

