name: OUSL LMS Daily Watcher

on:
  schedule:
    # 02:00 UTC = 07:30 AM Sri Lanka Time (UTC+5:30)
    # 14:00 UTC = 07:30 PM Sri Lanka Time (UTC+5:30)
    - cron: '0 2,14 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  check-lms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run Crawler
        env:
          OUSL_USERNAME: ${{ secrets.OUSL_USERNAME }}
          OUSL_PASSWORD: ${{ secrets.OUSL_PASSWORD }}
        run: |
          python crawler.py

      - name: Commit and push updated digest data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update LMS academic digest data [skip ci]" && git push)
